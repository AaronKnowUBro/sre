# ---------------------------------------------------------------------------
# Prometheus: configuracion, reglas de alerta, deployment y servicio
# (Requisito 3)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      # Cada 15s se recolectan las metricas. Un intervalo mas corto da mas
      # resolucion a costa de almacenamiento y CPU.
      scrape_interval: 15s
      # Cada 15s se reevaluan las reglas de alerta.
      evaluation_interval: 15s
      # Si un scrape no responde en 10s se marca el target como caido, antes
      # de que el siguiente ciclo se acumule encima.
      scrape_timeout: 10s
      external_labels:
        cluster: minikube
        project: sre-final-project

    # Prometheus evalua las reglas y envia las alertas que disparan hacia
    # Alertmanager, que decide a donde notificarlas.
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

    # Las reglas viven en un ConfigMap aparte montado en este directorio.
    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # ---------------------------------------------------------------
      # 1) Prometheus se recolecta a si mismo. Es la primera senal de que
      #    el stack de observabilidad esta vivo: si este target cae, nada
      #    de lo demas es confiable.
      # ---------------------------------------------------------------
      - job_name: prometheus-self
        static_configs:
          - targets: ['127.0.0.1:9090']

      # ---------------------------------------------------------------
      # 2) Pods marcados con anotaciones.
      #
      #    El descubrimiento se limita a los dos namespaces del proyecto en
      #    lugar de recorrer el cluster completo: Prometheus mantiene en
      #    memoria el estado de cada objeto que observa, y vigilar
      #    kube-system y el resto no aporta nada aqui.
      #
      #    La direccion se arma concatenando IP y puerto con 'separator',
      #    sin necesidad de una expresion regular con grupos de captura.
      # ---------------------------------------------------------------
      - job_name: annotated-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - sre-app
                - monitoring

        relabel_configs:
          # Solo entran los pods que declaran querer ser recolectados.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep

          # Un pod en Pending o Terminating no puede responder: descartarlo
          # aqui evita targets en rojo durante cada rollout.
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep

          # El puerto es obligatorio. Sin esta comprobacion, un pod sin la
          # anotacion produciria una direccion terminada en ':' y el target
          # quedaria permanentemente caido sin explicacion evidente.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: "[0-9]+"
            action: keep

          # IP y puerto se unen con ':' usando el separador, en lugar de
          # reconstruir la cadena con una regex y grupos de captura.
          - source_labels:
              - __meta_kubernetes_pod_ip
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            separator: ":"
            target_label: __address__
            action: replace

          # Ruta personalizada si el pod la declara; si no, queda /metrics.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
            action: replace

          # Se usan los nombres de etiqueta convencionales del ecosistema
          # (namespace, pod, container, node) y no variantes propias: asi las
          # consultas y los dashboards de la comunidad funcionan sin traducir
          # nombres, y las metricas de la aplicacion se pueden unir con las
          # de cAdvisor, que ya trae esas mismas etiquetas.
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

        metric_relabel_configs:
          # Las metricas internas del recolector de basura y del planificador
          # de Go no participan en ningun SLO de este proyecto y multiplican
          # el numero de series por cada pod. Se descartan en la ingesta.
          - source_labels: [__name__]
            regex: "go_(gc|memstats|sched)_.*"
            action: drop

      # ---------------------------------------------------------------
      # 3) Metricas de contenedores desde cAdvisor.
      #
      #    Se consulta a traves del subrecurso proxy del API server
      #    (/api/v1/nodes/<nodo>/proxy/metrics/cadvisor) en lugar de abrir
      #    una conexion al puerto 10250 del kubelet. Dos ventajas: no hace
      #    falta que la red del pod alcance al nodo, y la autenticacion y el
      #    certificado son los del API server, que el ServiceAccount ya
      #    tiene montados, sin necesidad de omitir la verificacion TLS.
      # ---------------------------------------------------------------
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node

        relabel_configs:
          # Todas las consultas van al API server, no al nodo.
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          # La ruta identifica de que nodo se piden las metricas.
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

        metric_relabel_configs:
          # cAdvisor expone cientos de series por cada contenedor del nodo,
          # incluidos los del plano de control. Se conservan solo los dos
          # namespaces del proyecto.
          - source_labels: [namespace]
            regex: "sre-app|monitoring"
            action: keep
          # Las series sin nombre de contenedor son agregados del pod
          # completo y duplican la informacion de las series por contenedor.
          - source_labels: [container]
            regex: ""
            action: drop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app: prometheus
data:
  alerts.yml: |
    groups:
      # ---------------------------------------------------------------
      # Alertas basadas en los Golden Signals de la aplicacion
      # ---------------------------------------------------------------
      - name: sre-app-golden-signals
        rules:
          # ERRORES: porcentaje de respuestas 5xx sobre el total.
          # rate() sobre 2 minutos reacciona rapido sin ser ruidoso.
          # El 'for: 1m' evita alertar por un pico de un solo scrape.
          - alert: HighErrorRate
            expr: |
              100 * (
                sum(rate(http_requests_total{status=~"5.."}[2m]))
                /
                clamp_min(sum(rate(http_requests_total[2m])), 0.001)
              ) > 20
            for: 1m
            labels:
              severity: critical
              service: sre-app
            annotations:
              summary: "Tasa de error alta en sre-app"
              description: "Mas del 20% de las peticiones devuelven 5xx durante el ultimo minuto. Valor actual {{ $value | printf \"%.1f\" }}%."
              runbook: "docs/runbook.md#highErrorRate"

          # LATENCIA: percentil 95 calculado desde los buckets del histograma.
          # Se usa p95 y no el promedio porque el promedio esconde la cola
          # lenta, que es la que afecta la experiencia del usuario.
          - alert: HighLatencyP95
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
              ) > 1
            for: 2m
            labels:
              severity: warning
              service: sre-app
            annotations:
              summary: "Latencia p95 por encima de 1 segundo"
              description: "El percentil 95 de latencia es {{ $value | printf \"%.2f\" }}s, por encima del objetivo de 1s."
              runbook: "docs/runbook.md#highLatencyP95"

          # SATURACION: peticiones concurrentes acumuladas.
          - alert: HighSaturation
            expr: sum(app_inflight_requests) > 20
            for: 2m
            labels:
              severity: warning
              service: sre-app
            annotations:
              summary: "Saturacion alta en sre-app"
              description: "Hay {{ $value }} peticiones en curso simultaneas."
              runbook: "docs/runbook.md#highSaturation"

          # TRAFICO: ausencia total de peticiones. Un dashboard en cero puede
          # significar que nadie usa el servicio o que algo aguas arriba se
          # rompio.
          - alert: NoTraffic
            expr: sum(rate(http_requests_total[5m])) == 0
            for: 5m
            labels:
              severity: info
              service: sre-app
            annotations:
              summary: "Sin trafico en sre-app"
              description: "La aplicacion no ha recibido peticiones en los ultimos 5 minutos."
              runbook: "docs/runbook.md#noTraffic"

      # ---------------------------------------------------------------
      # Alertas de disponibilidad de la plataforma
      # ---------------------------------------------------------------
      - name: sre-app-availability
        rules:
          # 'up' lo genera Prometheus por cada target: 1 si responde, 0 si no.
          - alert: AppInstanceDown
            expr: up{job="annotated-pods", app="sre-app"} == 0
            for: 1m
            labels:
              severity: critical
              service: sre-app
            annotations:
              summary: "Instancia de sre-app sin responder"
              description: "El pod {{ $labels.pod }} del namespace {{ $labels.namespace }} no responde al scrape de Prometheus."
              runbook: "docs/runbook.md#appInstanceDown"

          # absent() dispara cuando la metrica desaparece por completo, caso
          # que 'up == 0' no cubre si el target deja de existir en el
          # descubrimiento.
          - alert: AppMetricsMissing
            expr: absent(app_up)
            for: 2m
            labels:
              severity: critical
              service: sre-app
            annotations:
              summary: "No llegan metricas de sre-app"
              description: "La metrica app_up no existe: ningun pod esta siendo recolectado."
              runbook: "docs/runbook.md#appMetricsMissing"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # Vincula el ServiceAccount con los permisos del archivo anterior.
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Retencion corta: suficiente para la demostracion y evita que
            # el disco del nodo se llene.
            - --storage.tsdb.retention.time=6h
            # Permite recargar la configuracion con POST /-/reload.
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        # emptyDir: los datos se pierden al reiniciar el pod. Aceptable en un
        # entorno de practica; en produccion seria un PersistentVolumeClaim.
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30909
