# ---------------------------------------------------------------------------
# Aplicacion instrumentada (Requisito 1 y 2)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-app
  namespace: sre-app
  labels:
    app: sre-app
spec:
  # Dos replicas: permite ver metricas por pod en Grafana y demostrar que la
  # agregacion con sum() en PromQL suma correctamente entre instancias.
  replicas: 2
  selector:
    matchLabels:
      app: sre-app
  template:
    metadata:
      labels:
        app: sre-app
      # Estas anotaciones son la clave del service discovery de Prometheus:
      # el job 'kubernetes-pods' las lee y solo recolecta los pods marcados.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sre-app
          image: sre-final-project-app:latest
          # IfNotPresent usa la imagen que ya esta en el nodo, cargada con
          # 'minikube image load', y solo intentaria descargarla si faltara.
          # No se usa Never porque con el runtime containerd el nombre puede
          # quedar normalizado como docker.io/library/... y Never fallaria con
          # ErrImageNeverPull en lugar de resolver la imagen local.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            # Un 10% de errores genera una tasa visible en el dashboard sin
            # que la aplicacion parezca completamente caida.
            - name: ERROR_RATE
              value: "0.1"
            - name: MIN_LATENCY
              value: "0.05"
            - name: MAX_LATENCY
              value: "0.4"
          # Limites explicitos: sin ellos el pod no tiene QoS garantizada y
          # las metricas de saturacion de cAdvisor no tienen referencia.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # /health no tiene latencia artificial, por eso es seguro usarlo en
          # las probes incluso mientras se demuestran alertas de latencia.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sre-app
  namespace: sre-app
  labels:
    app: sre-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
    prometheus.io/path: "/metrics"
spec:
  # NodePort permite abrir la app desde el host con 'minikube service'.
  type: NodePort
  selector:
    app: sre-app
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500
